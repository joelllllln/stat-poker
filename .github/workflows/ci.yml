name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Without this the default is six hours. A browser download that hangs —
    # which is a thing that happens — then holds the deploy for the rest of the
    # day while every check that actually tests the code has already passed.
    # Twenty minutes is roughly four times a normal run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Cached between runs: the download is the slowest step here by far and
      # the only one that has ever hung.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Without --with-deps. That flag shells out to apt-get to fetch system
      # libraries, and apt against a slow mirror is what hung this step twice
      # in a row for half an hour each time. The ubuntu-latest image already
      # ships what Chromium needs; if it ever stops doing so the smoke test
      # fails at launch and says so, which is a better failure than a stall.
      - name: Install a browser for the smoke test
        timeout-minutes: 8
        run: npx playwright install chromium
      # Served from a subdirectory rather than the root, because that is what
      # Pages does: a build with absolute asset paths passes at the root and
      # then loads nothing once published.
      - name: Serve the build the way Pages serves it
        run: |
          mkdir -p site/stat-poker
          cp -r dist/. site/stat-poker/
          python3 -m http.server 4180 --directory site &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4180/stat-poker/ > /dev/null && exit 0
            sleep 1
          done
          echo 'the built site never came up' >&2
          exit 1
      - name: Smoke test
        run: node scripts/smoke.mjs
        env:
          SMOKE_URL: http://localhost:4180/stat-poker/
      - name: Screenshot from a failed smoke test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: screenshot.png
          if-no-files-found: ignore

  # The exhaustive checks run on their own schedule rather than on every push:
  # verifying all 133,784,560 seven-card hands takes over a minute, and it can
  # only fail if the evaluator changed.
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exhaustive evaluator and solver checks
        run: npm run test:slow

  # Publishing runs behind the checks rather than beside them: the deployed
  # link outlives the push that made it, so it should never carry a build that
  # did not typecheck, pass its tests, and run in a browser at a Pages-shaped
  # URL. Pages must be switched on for the repository first
  # (Settings -> Pages -> Source: GitHub Actions); the workflow token is not
  # allowed to switch it on by itself.
  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
