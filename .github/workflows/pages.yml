# Publishes the built app to GitHub Pages.
#
# Everything runs in the browser — the engine, the equity work, the solver —
# so a static host is all this needs. The build is checked before it ships:
# a broken deploy is worse than no link, because the link keeps working.
name: Pages

on:
  push:
    branches: ['main', 'claude/poker-app-ai-analytics-swz64l']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a queued one may be dropped in favour of a newer
# commit: what matters is that the site ends up matching the latest push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # `enablement` turns Pages on for the repository the first time this
      # runs, so the site does not need a settings visit to exist.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
