    <title>Stat Poker — learn hold’em by the numbers</title>

      name="description"
      content="A no-limit hold’em trainer. Every decision priced against the range you are facing, every hand reviewed afterwards, and a record that stays on your device."

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
